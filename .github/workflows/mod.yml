# Companion mod CI (docs/design/14-distribution.md, *Tests across versions*; docs/design/10).
#   smoke: per target (Minecraft version x loader), it builds, the GameTest server starts with the
#          mod, the pointer file is written and the bridge pairs (runSmokeTestServer). No JUnit tests,
#          so the protocol's golden-vector test (GoldenVectorsTest) never blocks a target's smoke.
#   full:  the Craftoria profile only (1.21.1, NeoForge): JUnit tests, including GoldenVectorsTest
#          against test/data/world-protocol, and the whole GameTest suite.
#   client: a real client on the dev profile (1.21.1, NeoForge), headless (Xvfb, Mesa): every client test suite (16, *Testing*).
name: mod

on:
  push:
    branches: [main]
    paths: ["mod/**", "test/data/world-protocol/**", "test/support/fake-mcp.ts", ".github/workflows/mod.yml"]
  pull_request:
    paths: ["mod/**", "test/data/world-protocol/**", "test/support/fake-mcp.ts", ".github/workflows/mod.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Stonecutter versions (mod/settings.gradle). Add a target here when it is added there.
        target: ["1.21.1"]
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, loader check, smoke GameTest
        run: ./gradlew --console=plain ":common:${{ matrix.target }}:checkNoLoaderImports" ":neoforge:${{ matrix.target }}:assemble" ":neoforge:${{ matrix.target }}:runSmokeTestServer"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-smoke-${{ matrix.target }}
          path: |
            mod/neoforge/versions/${{ matrix.target }}/build/libs/*.jar
            mod/run/smoke/logs/
          if-no-files-found: warn

  full:
    name: full suite (Craftoria profile)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, JUnit tests, all GameTests
        run: ./gradlew --console=plain build :neoforge:1.21.1:runGameTestServer
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mod-full-reports
          path: |
            mod/common/versions/*/build/reports/tests/
            mod/run/gametest/logs/
          if-no-files-found: ignore

  # The client test harness (docs/design/16-in-game-ui.md, *Testing*, client half): a real client on
  # the dev profile, headless under Xvfb with Mesa software rendering, running every client test
  # suite against the mod and the fake MCP (test/support/fake-mcp.ts, run with tsx, hence Node).
  # The report (with the boot timings) is uploaded every time; logs and screenshots on failure.
  client:
    name: client tests (headless, dev profile)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install Node dependencies (for the fake MCP)
        working-directory: .
        run: npm ci
      - name: Install Xvfb, Mesa, xdotool and GLFW's X11 libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool libgl1 libgl1-mesa-dri libglx-mesa0 \
            libx11-6 libxrandr2 libxcursor1 libxi6 libxinerama1 libxxf86vm1 libxext6 libxrender1
      - name: Client tests
        run: ./clienttest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-client-report
          path: mod/run/clienttest/report.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mod-client-failure
          path: |
            mod/run/clienttest/logs/
            mod/run/clienttest/crash-reports/
            mod/run/clienttest/clienttest-screenshots/
          if-no-files-found: ignore
