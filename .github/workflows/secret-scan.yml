# Secret scan (second layer after the pre-commit hook, scripts/secret-scan.mjs; GitHub push
# protection is the third). gitleaks over the full history on every push and pull request, so a
# commit made with --no-verify, or from a clone without the hook, still fails here.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: Scan working tree (same rules as the pre-commit hook)
        run: node scripts/secret-scan.mjs --tree
