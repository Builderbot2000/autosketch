# gitleaks config for the CI secret scan (.github/workflows/secret-scan.yml). Default rules, plus the
# fixture values that look like secrets on purpose. Keep in step with ALLOW_VALUES in
# scripts/secret-scan.mjs, the pre-commit layer.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures"
regexes = [
  '''9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08''', # sha256("test"), bridge test token
]
stopwords = ["secret-scan: allow"]
