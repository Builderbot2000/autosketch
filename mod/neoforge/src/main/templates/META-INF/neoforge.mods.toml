modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Links a running game to a local Autosketch MCP server: work and context volumes marked in-game,
conditional patches from the agent, and the player's hand edits reported back. Runs on the server;
the client half (air clicks, previews) is optional.
'''
# The client half is optional (13, M2, B2): clients without the mod may join, and clients with it join servers without it.
displayTest="IGNORE_ALL_VERSION"

# Silo O: the change tracker's hook on chunk block writes (M9).
[[mixins]]
    config="autosketch.mixins.json"

# Silo R (16): replay ignores the server's block updates inside the replayed volume (client only).
[[mixins]]
    config="autosketch.client.mixins.json"

# Canvas set G1 (19): the client half rewrites its own status lines in chat in place (client only).
[[mixins]]
    config="autosketch.chat.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The config file and the client's config screen (14, *Config across loaders*). Required wherever
# this mod is installed; vanilla clients joining a server are unaffected.
[[dependencies.${mod_id}]]
    modId="cloth_config"
    type="required"
    versionRange="${cloth_config_version_range}"
    ordering="NONE"
    side="BOTH"
