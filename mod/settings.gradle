pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    // Provisions JDK 21 through Gradle toolchains when the machine has none.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'autosketch-mod'

// The MultiLoader layout (docs/design/14-distribution.md, *Build layout*): `common` holds every
// class that uses only vanilla types and is compiled into each loader's jar; `neoforge` is the thin
// NeoForge module (entry point, events, GameTests).
include 'common', 'neoforge'
