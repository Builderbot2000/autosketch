modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Links a running game to a local Autosketch MCP server: work and context volumes marked in-game,
conditional patches from the agent, and the player's hand edits reported back. Server-side only.
'''
# Server-side only (M2): clients without the mod may join, and clients with it don't require it on the server.
displayTest="IGNORE_ALL_VERSION"

# Silo O: the change tracker's hook on chunk block writes (M9).
[[mixins]]
    config="autosketch.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
