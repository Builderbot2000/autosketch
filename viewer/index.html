<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autosketch Observer</title>
  <link rel="stylesheet" href="style.css">
  <!-- three.js comes from the installed package, served by the observer (src/observe/http.ts). -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <header>
    <b>Autosketch</b>
    <nav id="tabs" aria-label="sections">
      <button data-tab="observe" class="on">Observe</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="library">Library</button>
      <button data-tab="instance">Instance</button>
    </nav>
    <span id="docname" class="obs-only">…</span>
    <span id="session" class="dim obs-only"></span>
    <span id="seq" class="dim obs-only"></span>
    <span id="assets" class="dim obs-only"></span>
    <span class="grow"></span>
    <button id="fit" class="obs-only" title="Frame the whole build">Fit</button>
    <span id="status">connecting…</span>
  </header>
  <main>
    <section id="view-wrap" class="panel">
      <canvas id="view"></canvas>
      <div id="labels"></div>
      <figure id="fallback" hidden>
        <img id="fallback-img" alt="time-lapse snapshot">
        <figcaption><span id="fallback-note"></span> <button id="fallback-close">Show 3D</button></figcaption>
      </figure>
      <div class="hint">drag: orbit · right-drag or shift-drag: pan · wheel: zoom · boxes: open jobs (work filled, context wireframe)</div>
      <section id="drill" hidden>
        <div class="drill-bar"><b id="drill-title"></b> <span id="drill-note" class="dim"></span><span class="grow"></span><button id="drill-close">Close</button></div>
        <canvas id="drill-canvas"></canvas>
      </section>
    </section>
    <section class="panel side">
      <h2>Scopes</h2>
      <div id="scopes"></div>
      <h2>Tokens <span class="dim">from Claude Code's telemetry</span></h2>
      <div id="spend"></div>
      <h2>Events
        <select id="f-doc"><option value="">all documents</option></select>
        <select id="f-kind">
          <option value="">all kinds</option>
          <option value="doc">doc.*</option>
          <option value="call">call.*</option>
          <option value="scope">scope.*</option>
          <option value="call.refused">refusals</option>
          <option value="render.produced">renders</option>
          <option value="state.add">state.add</option>
          <option value="otel">otel (telemetry)</option>
        </select>
        <input id="f-tool" placeholder="tool" size="8">
        <label><input id="f-refusals" type="checkbox"> refused only</label>
      </h2>
      <div id="feed"></div>
    </section>
    <div class="bottom">
      <section class="panel">
        <h2>Timeline <span class="dim">fork → merge; red: refusals, amber: lock waits</span></h2>
        <div id="timeline"></div>
      </section>
      <section class="panel">
        <h2>Activity <span class="dim">edit density, lock rectangles</span></h2>
        <canvas id="activity"></canvas>
      </section>
    </div>
  </main>
  <footer id="replay">
    <button id="replay-play" title="Play from here">▶</button>
    <input id="replay-seq" type="range" min="0" max="0" value="0" step="1" aria-label="replay position (seq)">
    <span id="replay-pos" class="dim"></span>
    <button id="replay-live" title="Follow the latest event">Live</button>
  </footer>
  <div id="tab-host"></div>
  <script type="module">
    // App shell (docs/design/15-management-ui.md, *App shell*). Inline, so the Observe tab loads
    // exactly what it did before; every other tab is an ESM module under js/tabs/, imported the
    // first time it is opened. A tab module exports `mount(el, ctx)` and may return `{ show, hide }`.
    //
    // Writes (15, *Security*): the server puts a per-launch token in the URL fragment (#t=…), which
    // is never sent to a server. It is kept in sessionStorage, dropped from the address bar, and sent
    // as X-Autosketch-Token on every request that changes something.
    const KEY = "autosketch.token";
    const found = /(?:^#|&)t=([\w-]+)/.exec(location.hash);
    let token = found?.[1];
    try {
      if (token) sessionStorage.setItem(KEY, token);
      else token = sessionStorage.getItem(KEY) ?? undefined;
    } catch { /* storage blocked: the token lives as long as the page */ }
    const TABS = { settings: "./js/tabs/settings.js", library: "./js/tabs/library.js", instance: "./js/tabs/instance.js" };
    // `#settings`, or `#tab=instance` (the server opens `#t=<token>&tab=instance` as the setup wizard).
    const tabFromHash = () => {
      for (const part of location.hash.replace(/^#/, "").split("&")) {
        const t = part.startsWith("tab=") ? part.slice(4) : part;
        if (t in TABS) return t;
      }
      return "observe";
    };

    async function api(path, { method = "GET", body } = {}) {
      const headers = { accept: "application/json" };
      if (method !== "GET") {
        headers["x-autosketch-token"] = token ?? "";
        if (body !== undefined) headers["content-type"] = "application/json";
      }
      const r = await fetch(`api/${path}`, { method, headers, ...(body !== undefined ? { body: JSON.stringify(body) } : {}) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(data.error ?? `HTTP ${r.status}`), { status: r.status, data });
      return data;
    }
    const ctx = { api, canWrite: () => !!token };

    const mounted = new Map();
    let current = null;
    async function show(name) {
      if (name === current) return;
      current = name;
      document.body.dataset.tab = name;
      for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === name);
      document.querySelector("main").hidden = document.getElementById("replay").hidden = name !== "observe";
      for (const [n, t] of mounted) if (n !== name && !t.el.hidden) { t.el.hidden = true; t.hide?.(); }
      history.replaceState(null, "", location.pathname + location.search + (name === "observe" ? "" : `#${name}`));
      if (name === "observe") return;
      let t = mounted.get(name);
      if (!t) {
        const el = Object.assign(document.createElement("section"), { id: `tab-${name}`, className: "tab" });
        document.getElementById("tab-host").append(el);
        t = { el };
        mounted.set(name, t);
        try {
          Object.assign(t, (await (await import(TABS[name])).mount(el, ctx)) ?? {});
        } catch (e) {
          el.textContent = `This tab failed to load: ${e.message}`;
        }
      }
      if (current !== name) return;
      t.el.hidden = false;
      t.show?.();
    }
    for (const b of document.querySelectorAll("#tabs button")) b.addEventListener("click", () => void show(b.dataset.tab));
    window.addEventListener("hashchange", () => void show(tabFromHash()));
    void show(tabFromHash());
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
